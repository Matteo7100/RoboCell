name: ROS Jazzy verification

on:
  push:
    branches: [main, codex/verification-tcp]
    paths:
      - 'vision_sort_lab/**'
      - 'docs/robot_reference/**'
      - '.github/workflows/ros-verification.yml'

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base-noble
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions python3-pytest python3-yaml \
            ros-jazzy-moveit-msgs ros-jazzy-tf2-ros-py \
            ros-jazzy-moveit-resources-panda-description
      - name: Build package
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --packages-select vision_sort_lab
      - name: Unit tests
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 -m unittest discover -s vision_sort_lab/test -p '*_unit.py' -v
          python3 -m compileall -q vision_sort_lab/vision_sort_lab vision_sort_lab/test
      - name: Real ROS timer, single result and cleanup
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 -m pytest -q -s vision_sort_lab/test/test_timeout_ros.py vision_sort_lab/test/test_tcp_probe_ros.py
      - name: Check reviewed finger mesh against the installed Panda package
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 -c "from pathlib import Path; from vision_sort_lab.panda_tcp import check_finger_mesh; print(check_finger_mesh(Path('/opt/ros/jazzy/share/moveit_resources_panda_description/meshes/collision/finger.stl').read_bytes()))"
      - name: Compare the uploaded MoveIt and publisher models
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          ros2 run vision_sort_lab robot_reference \
            --move-group docs/robot_reference/move_group.urdf \
            --semantic docs/robot_reference/move_group.srdf \
            --state-publisher docs/robot_reference/robot_state_publisher.params.yaml \
            --nominal-panda-tcp > robot-reference-report.json
          python3 -c "import json; r=json.load(open('robot-reference-report.json')); assert r['kinematics_match']; assert r['tcp_definition']['xyz_m'] == [0, 0, 0.1034]; print('Uploaded models agree; nominal TCP offset confirmed')"
